# The terminal emulator, on its own. Deliberately NOT part of the platform's
# docker-compose.yml: start it when you want virtual terminals, stop it (or
# delete this folder) and the platform is untouched.
#
#   cd emulator && docker compose up -d --build
#
# No .env needed to start: it then talks to the platform's default broker
# (broker.hivemq.com, root Pay) and prints a generated super-admin password
# once in `docker compose logs emulator`. Copy .env.example to .env to change
# any of that.

services:
  emulator:
    build:
      context: .
    image: eideas/terminal-emulator:latest
    container_name: eideas-terminal-emulator
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      EMULATOR_PORT: 8095
      EMULATOR_DB_PATH: /app/data/emulator.db
    extra_hosts:
      # Reach a broker running on this machine as host.docker.internal.
      - 'host.docker.internal:host-gateway'
    ports:
      - '${EMULATOR_HOST_PORT:-8095}:8095'
    volumes:
      # Its own SQLite file, in its own volume.
      - emulator-data:/app/data

volumes:
  emulator-data:
